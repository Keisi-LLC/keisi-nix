# Where this app deploys: nowhere, until it is promoted. Push-to-main runs CI
# only; day-to-day dev is `forge-dev <slug>` on Forge (tailnet-only).
#
# NOTE: `app` is the unit (app@<slug>), socket (/run/apps/<slug>/app.sock) and
# data dir (/var/lib/apps/<slug>) once this app IS promoted.
app: keisi-app # EDIT: your app slug

# No `dev:` target on purpose. Since 2026-08-17 the keisi box hosts ONLY
# promoted apps, so there is no non-prod destination to deploy to — dev lives
# on Forge. A manual workflow dispatch therefore fails loudly ("no 'dev'
# target") rather than putting an un-promoted app on the public box.
#
# On promotion, uncomment prod: and ship with a DATE tag —
# `git tag "v$(date +%Y.%m.%d)" && git push --tags`. Tags are vYYYY.MM.DD,
# not semver (keisi-handbook GITOPS.md §Release tags). HaHRegistration's
# targets.yml is the worked example.
# prod:
#   ssh: deploy@<box>
#   url: https://<domain>
